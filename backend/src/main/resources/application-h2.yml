# Lightweight, non-durable profile: local runs without Docker and (while Docker is unavailable) integration tests.
# In-memory data is lost on restart (spec/test-strategy.md TS-PERS-07).
spring:
  datasource:
    url: jdbc:h2:mem:supportdesk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
