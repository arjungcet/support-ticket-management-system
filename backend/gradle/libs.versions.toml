# Single source of plugin and library versions (rules/java-springboot.md §8).
# Libraries managed by the Spring Boot BOM intentionally omit a version.

[versions]
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
jacoco = "0.8.15"
# Overrides the Spring Boot BOM's Tomcat 11.0.24 (GHSA-9xv2-5v5q-p794, GHSA-gcx9-497g-6cp6, GHSA-h3x4-894j-xpx5;
# fixed in 11.0.25). Remove once a Spring Boot release manages Tomcat >= 11.0.25 (security review H-1).
tomcat = "11.0.26"

[libraries]
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
